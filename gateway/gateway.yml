# Shared OpenAI-compatible gateway in front of Docker Model Runner.
#
# Started by systemd (see systemd/docker-model-gateway.service):
#   docker model gateway --config gateway/gateway.yml --host 172.30.50.1 --port 4000
#
# Clients must send Authorization: Bearer $GATEWAY_API_KEY (or x-api-key).
# Add a model_list entry for every model under models: in compose.yaml.

model_list:
  - model_name: google/medgemma-1.5-4b-it
    params:
      model: docker_model_runner/hf.co/google/medgemma-1.5-4b-it
      api_base: http://127.0.0.1:12434/engines/vllm/v1

  - model_name: Qwen/Qwen3.5-2B
    params:
      model: docker_model_runner/hf.co/Qwen/Qwen3.5-2B
      api_base: http://127.0.0.1:12434/engines/vllm/v1

general_settings:
  master_key: os.environ/GATEWAY_API_KEY
