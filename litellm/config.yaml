model_list:
  - model_name: ollama/*
    litellm_params:
      model: ollama_chat/*
      api_base: http://ollama:11434

  # Future vLLM backend. Not deployed. Uncomment and add the service.
  # - model_name: vllm/*
  #   litellm_params:
  #     model: hosted_vllm/*
  #     api_base: http://vllm:8000/v1

litellm_settings:
  # Expand ollama/* from Ollama's /api/tags so /v1/models lists pulled models.
  check_provider_endpoint: true
  # Budgets and rate limits are unset (unlimited). Tighten later with
  # max_budget, rpm_limit, and tpm_limit on each key in bootstrap-keys.sh,
  # or with general_settings defaults once you want a global cap.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Future Keycloak / OIDC. Not enabled. Set these when that service exists:
  #   GENERIC_CLIENT_ID
  #   GENERIC_CLIENT_SECRET
  #   GENERIC_AUTHORIZATION_ENDPOINT
  #   GENERIC_TOKEN_ENDPOINT
  #   GENERIC_USERINFO_ENDPOINT
  #   PROXY_BASE_URL=https://models.${BASE_DOMAIN}
