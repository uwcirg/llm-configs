# Dynamic router. MODEL_API_FQDN is injected into the Traefik container by Compose
# and expanded here via Traefik Go templating (dynamic file provider only).
#
# Upstream is the host bridge gateway address where docker model gateway binds.
# Authorization is enforced by the gateway master_key, not Traefik.

http:
  routers:
    model-api:
      rule: Host(`{{ env "MODEL_API_FQDN" }}`)
      entryPoints:
        - websecure
      service: model-gateway
      tls:
        certResolver: letsencrypt

  services:
    model-gateway:
      loadBalancer:
        servers:
          - url: "http://172.30.50.1:4000"
