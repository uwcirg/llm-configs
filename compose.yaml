# Shared Traefik front door + Compose network for the host Docker Model Gateway.
#
# Traefik publishes only 80/443. The gateway process is NOT a Compose service;
# it runs on the host via systemd, bound to 172.30.50.1:4000.
# The models service exits immediately; Compose uses it to pull and configure
# every entry under top-level models: via Docker Model Runner.

name: ${COMPOSE_PROJECT_NAME:-llm-configs}

services:
  models:
    image: alpine:3.20
    command: ["true"]
    restart: "no"
    models:
      - medgemma
      - qwen

  traefik:
    image: traefik:v3.3.7
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
    environment:
      MODEL_API_FQDN: ${MODEL_API_FQDN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - letsencrypt:/letsencrypt
    networks:
      - model_api_net

volumes:
  letsencrypt:

models:
  medgemma:
    model: hf.co/google/medgemma-1.5-4b-it
    context_size: 8192
    runtime_flags:
      - "--dtype"
      - "bfloat16"
      - "--gpu-memory-utilization"
      - "0.90"
  qwen:
    model: hf.co/Qwen/Qwen3.5-2B

networks:
  model_api_net:
    name: model_api_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.50.0/24
          gateway: 172.30.50.1
    driver_opts:
      com.docker.network.bridge.name: model_api_br
