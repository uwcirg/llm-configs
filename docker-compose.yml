name: llm-configs

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - llm_net

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-512}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - ${NVIDIA_VISIBLE_DEVICES}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - llm_net

  litellm:
    image: ghcr.io/berriai/litellm-database:v1.106.5
    restart: unless-stopped
    command: ["--config", "/app/config.yaml"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-admin-master-key-change-me}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-salt-change-me}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.models.rule=Host(`models.${BASE_DOMAIN}`)
      - traefik.http.routers.models.entrypoints=websecure
      - traefik.http.routers.models.tls.certresolver=letsencrypt
      - traefik.http.services.models.loadbalancer.server.port=4000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness')"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks:
      - llm_net

  litellm-bootstrap:
    image: curlimages/curl:8.11.1
    restart: "no"
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-admin-master-key-change-me}
      LITELLM_RESEARCHER_KEY: ${LITELLM_RESEARCHER_KEY:-sk-researcher-key-change-me}
    volumes:
      - ./litellm/bootstrap-keys.sh:/bootstrap.sh:ro
    depends_on:
      litellm:
        condition: service_healthy
    networks:
      - llm_net

  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.12.4
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/openwebui
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-poc-webui-secret-key-change-me}
      WEBUI_URL: https://llm.${BASE_DOMAIN}
      ENABLE_SIGNUP: "false"
      ENABLE_PERSISTENT_CONFIG: "false"
      WEBUI_ADMIN_EMAIL: admin@${BASE_DOMAIN}
      WEBUI_ADMIN_PASSWORD: admin
      WEBUI_ADMIN_NAME: admin
      ENABLE_OLLAMA_API: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_BASE_URLS: http://ollama:11434
      # Hide bare Ollama ids from the chat selector. Admin → Settings → Models
      # still pulls through this connection. Chat uses the LiteLLM models.
      OLLAMA_API_CONFIGS: '{"0":{"enable":true,"model_ids":["__pull_only__"]}}'
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_BASE_URLS: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_RESEARCHER_KEY:-sk-researcher-key-change-me}
      OPENAI_API_KEYS: ${LITELLM_RESEARCHER_KEY:-sk-researcher-key-change-me}
      # Future Keycloak / OIDC. Leave unset until that service exists.
      # OAUTH_CLIENT_ID: ""
      # OAUTH_CLIENT_SECRET: ""
      # OPENID_PROVIDER_URL: https://auth.${BASE_DOMAIN}/realms/llm/.well-known/openid-configuration
      # OPENID_REDIRECT_URI: https://llm.${BASE_DOMAIN}/oauth/oidc/callback
      # ENABLE_OAUTH_SIGNUP: "true"
      # OAUTH_PROVIDER_NAME: Keycloak
    labels:
      - traefik.enable=true
      - traefik.http.routers.llm.rule=Host(`llm.${BASE_DOMAIN}`)
      - traefik.http.routers.llm.entrypoints=websecure
      - traefik.http.routers.llm.tls.certresolver=letsencrypt
      - traefik.http.services.llm.loadbalancer.server.port=8080
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks:
      - llm_net

  openwebui-bootstrap:
    image: curlimages/curl:8.11.1
    restart: "no"
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      WEBUI_ADMIN_EMAIL: admin@${BASE_DOMAIN}
      WEBUI_ADMIN_PASSWORD: admin
      RESEARCHER_EMAIL: researcher@${BASE_DOMAIN}
      RESEARCHER_PASSWORD: researcher
      RESEARCHER_NAME: researcher
      USER_EMAIL: user@${BASE_DOMAIN}
      USER_PASSWORD: user
      USER_NAME: user
    volumes:
      - ./openwebui/bootstrap-users.sh:/bootstrap.sh:ro
    depends_on:
      openwebui:
        condition: service_healthy
    networks:
      - llm_net

  traefik:
    image: traefik:v3.6.25
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-ivanc@uw.edu}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    # PoC only — replace before production. Basic Auth is admin / admin.
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik-dashboard.${BASE_DOMAIN}`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.dashboard.middlewares=dashboard-auth
      - traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$apr1$$1i6/eB1/$$.soOV9qd1KopUGFhfw/zL0
    networks:
      - llm_net

volumes:
  postgres-data:
  ollama-models:
  traefik-acme:

networks:
  llm_net:
    name: llm_net
    driver: bridge
