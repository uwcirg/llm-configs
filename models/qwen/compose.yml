# Qwen 3.5 2B via Ollama (https://ollama.com/library/qwen3.5:2b).
#
# Merged by deploy.sh:
#   docker compose -f compose.yaml -f models/qwen/compose.yml ...
#
# Ollama listens only on host loopback so the host gateway can reach it at
# 127.0.0.1:11434 without exposing it on the Traefik bridge or public NIC.
# Register the alias in gateway/gateway.yml so clients can reach it.

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_storage:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - ollama_internal

  ollama-pull-qwen:
    image: ollama/ollama:latest
    restart: "no"
    volumes:
      - ollama_storage:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "sleep 2; ollama pull qwen3.5:2b"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    networks:
      - ollama_internal

volumes:
  ollama_storage:
