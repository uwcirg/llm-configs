# MedGemma via Docker Model Runner (vLLM).
#
#   docker compose -f models/medgemma/compose.yml up -d
#
# Requires DMR with vLLM on the host:
#   docker model install-runner --backend vllm --gpu cuda
#
# Set HUGGING_FACE_HUB_TOKEN in .env for the gated HF model pull.
# Register the model in ../../gateway.yaml so clients can reach it.

services:
  medgemma-model:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    models:
      medgemma:
        endpoint_var: MEDGEMMA_URL
        model_var: MEDGEMMA_MODEL

models:
  medgemma:
    model: hf.co/google/medgemma-1.5-4b-it
    context_size: 8192
    runtime_flags:
      - "--dtype"
      - "bfloat16"
      - "--gpu-memory-utilization"
      - "0.90"
